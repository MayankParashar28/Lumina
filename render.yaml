services:
  - type: web
    name: lumina
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URL
        sync: false
      # The public site URL. Not a secret, so it is kept in the blueprint rather
      # than the dashboard: canonical/og tags and the sitemap all derive from it,
      # and without it they fall back to the .onrender.com host, which tells search
      # engines the custom domain is not the authoritative copy. No trailing slash.
      - key: BASE_URL
        value: https://llumina.online
      - key: REDIS_URL
        sync: false
      # ⚠️ TEMPORARY — the Upstash free tier's request quota is exhausted
      # (500,000/month), so every Redis call errors out. BullMQ polls its queues
      # continuously, which is what consumed the quota in the first place, and it
      # keeps consuming it even while every call fails.
      #
      # QUEUE_DISABLED runs each job inline instead of through BullMQ; the site
      # behaves exactly as it did before the queue was introduced.
      # REDIS_DISABLED stops the client being created at all — sessions go to
      # Mongo, and rate limits and caches use the in-process fallbacks. On the
      # free plan there is only ever one instance, so nothing needs to be shared
      # between instances and nothing is lost by this.
      #
      # To re-enable once the quota resets, or after moving to a paid Upstash
      # plan: set both of these to false (or delete them) and redeploy.
      - key: QUEUE_DISABLED
        value: "true"
      - key: REDIS_DISABLED
        value: "true"
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_KEY_LIGHT
        sync: false
      - key: GOOGLE_EMBEDDING_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Render blocks outbound SMTP, so Gmail connections from here just time out
      # (a signup spent 8.5s failing to connect). Resend delivers over HTTPS,
      # which is not blocked. Set RESEND_API_KEY in the dashboard; it is a secret,
      # so it stays out of the blueprint.
      - key: RESEND_API_KEY
        sync: false
      # Resend only accepts a sender on a domain verified in the account. Until
      # llumina.online is verified there, onboarding@resend.dev is the only valid
      # sender and it can only deliver to the Resend account's own address. Once
      # the domain is verified, change this to Lumina <noreply@llumina.online>.
      - key: EMAIL_FROM
        value: Lumina <onboarding@resend.dev>
      # SMTP fallback, used only when RESEND_API_KEY is absent. Kept for local
      # development and for hosts that permit outbound SMTP.
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: GIPHY_API_KEY
        sync: false

# The web service above runs background jobs in-process (default), so no separate
# worker is required on the free tier. To DECOUPLE the worker at scale (needs a paid
# plan — Render Background Workers aren't free), uncomment the service below and set
# QUEUE_WORKER_INLINE=false on the web service so it only enqueues:
